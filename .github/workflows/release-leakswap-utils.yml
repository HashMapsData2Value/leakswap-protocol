name: Release leakswap-utils

on:
  push:
    branches:
      - main
    paths:
      - 'leakswap-utils/**'

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

defaults:
  run:
    working-directory: leakswap-utils

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # OIDC trusted publishing needs npm >= 11.5.1; Node 22's bundled npm predates that.
      - run: npm install -g npm@latest

      - run: npm ci
      - run: npm test
      - run: npm run build

      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
